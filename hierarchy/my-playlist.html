<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Playlist - AniBeat</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .track {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-info h3 { margin: 0; font-size: 18px; }
    .track-info p { margin: 4px 0 0; color: #aaa; font-size: 14px; }
    .actions a {
      margin-left: 10px;
      color: #4d9eff;
      text-decoration: none;
    }
    .actions a.delete {
      color: #ff4d4d;
    }
    .btn-add {
      display: block;
      width: fit-content;
      margin: 20px auto;
      padding: 10px 20px;
      background: #2d3e69;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mi Playlist de Anime</h1>
    <div id="playlist"></div>
    <a href="edit-track.html" class="btn-add">+ Añadir canción</a>
  </div>

  <script src="../js/playlist.js"></script>
  <script>
    // Show list
    displayPlaylist();
  </script>
</body>
</html>
