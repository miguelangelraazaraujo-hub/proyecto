<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir / Editar Canción - AniBeat</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: white;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-save {
      background: #2d3e69;
      color: white;
      margin-right: 10px;
    }
    .btn-cancel {
      background: #444;
      color: white;
    }
    .form-actions {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="form-title">Añadir Canción</h1>
    <form id="track-form">
      <input type="hidden" id="track-id">
      <div class="form-group">
        <label for="title">Título</label>
        <input type="text" id="title" required>
      </div>
      <div class="form-group">
        <label for="artist">Artista</label>
        <input type="text" id="artist" required>
      </div>
      <div class="form-group">
        <label for="duration">Duración (ej. 3:26)</label>
        <input type="text" id="duration" required>
      </div>
      <div class="form-group">
        <label for="imageUrl">URL de la miniatura (opcional)</label>
        <input type="url" id="imageUrl">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-save">Guardar</button>
        <a href="my-playlist.html" class="btn btn-cancel">Cancelar</a>
      </div>
    </form>
  </div>

  <script src="../js/playlist.js"></script>
  <script>
    // Si hay un parámetro en la URL, cargar datos para editar
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (id) {
      loadTrackForEdit(id);
    }
  </script>
</body>
</html>
